name: failure_proxy_lead24h

target:
  column: target_failure_state_onset_24h
  lead_hours: 24
  window_hours: 24
  clean_history_days: 0

panel:
  latency_minutes: [0]
  failure_state_dictionary: failure_state_dictionary.json

features:
  preset: safe_recurrence  # core | recurrence | all_safe | safe_recurrence | no_same_day_failure

models:
  enabled: [rule, logistic, catboost, lightgbm]
  catboost:
    iterations: 500
    task_type: CPU
    threads: -1
  lightgbm:
    iterations: 500
    device_type: cpu  # cpu | gpu | cuda
    threads: -1

training:
  include_2021: false
  negative_to_positive_ratio: 20
  random_seed: 20260919

category_selection:
  mode: evidence  # evidence | fixed | all
  column: тип_датчика
  minimum_train_events: 100
  fixed_values: []

evaluation:
  minimum_precision: 0.20
  alert_budget_per_day: 50
  cooldown_hours: 72
  bootstrap_repeats: 50
  evaluate_test: false
