resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
limit_conn_zone $server_port zone=import_uploads:64k;
map $status $import_retry_default { default ""; 429 "3"; }
map $upstream_http_retry_after $import_retry_after { default $upstream_http_retry_after; "" $import_retry_default; }
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    set $api_upstream http://backend:8000;
    set $ui_upstream http://frontend:8080;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 51m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Retry-After $import_retry_after always;
    proxy_hide_header Retry-After;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /api/v1/auth/login {
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_pass $api_upstream;
    }
    location = /api/v1/imports/events {
        limit_conn import_uploads 4;
        limit_conn_status 429;
        error_page 429 = @import_capacity_busy;
        proxy_set_header Host $host;
        proxy_read_timeout 310s;
        proxy_pass $api_upstream;
    }
    location @import_capacity_busy {
        default_type application/json;
        return 429 '{"detail":{"code":"IMPORT_UPLOAD_CAPACITY_BUSY","message":"Import uploads busy; retry later"}}';
    }
    location /api/ {
        proxy_set_header Host $host;
        proxy_read_timeout 310s;
        proxy_pass $api_upstream;
    }
    location = /openapi.json { proxy_set_header Host $host; proxy_pass $api_upstream; }
    location = /health { proxy_set_header Host $host; proxy_pass $api_upstream; }
    location = /ready { proxy_set_header Host $host; proxy_pass $api_upstream; }
    location / { proxy_pass $ui_upstream; }
}
