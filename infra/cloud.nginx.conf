worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
    server {
        listen __PORT__;
        root /site;
        client_max_body_size 51m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        proxy_set_header Host $host;
        location = /api/v1/auth/login {
            limit_req zone=login burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8000;
        }
        location /api/ { proxy_read_timeout 310s; proxy_pass http://127.0.0.1:8000; }
        location = /openapi.json { proxy_pass http://127.0.0.1:8000; }
        location = /health { proxy_pass http://127.0.0.1:8000; }
        location = /ready { proxy_pass http://127.0.0.1:8000; }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
